name: Build Distribution

on:
  workflow_dispatch:
  push:
    branches:
      - feat/unofficial-build
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # fankt fork（JVM 対応版）をビルドして ~/.m2 に publish し、
  # 後続ジョブへ artifact 経由で配る。GitHub Packages は使わず、
  # 認証情報の管理を不要にしている。
  fankt-maven:
    name: fankt (mavenLocal)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout fankt fork
        uses: actions/checkout@v4
        with:
          repository: nsmr0604/fankt
          # fankt 本体の main は upstream に追従させるため、JVM 対応は fork のブランチで管理する
          ref: feat/jvm-target

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # iOS の klib は Linux でもコンパイルできる（リンクは不要）。
      - name: Publish fankt to mavenLocal
        run: ./gradlew :fankt:fanbox-core:publishToMavenLocal :fankt:fanbox:publishToMavenLocal :fankt:fanbox-persistence-room:publishToMavenLocal

      - name: Upload mavenLocal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fankt-maven-local
          path: ~/.m2/repository/me/matsumo
          if-no-files-found: error
          retention-days: 1

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: fankt-maven

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore fankt mavenLocal artifacts
        uses: actions/download-artifact@v4
        with:
          name: fankt-maven-local
          path: ~/.m2/repository/me/matsumo

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # debug ビルドでは未設定の AdMob ID に自動でテスト ID が使われるため、ID のダミー注入は不要。
      # RevenueCat のキーは debug ビルドでも空のまま BillingClient が構築されると起動時に
      # クラッシュする。テスト配布 APK では課金 API への通信が失敗するだけで、
      # 呼び出し側は runCatching で握り潰す。
      - name: Create local.properties
        run: |
          cat > local.properties <<'EOF'
          # RevenueCat の起動クラッシュ対策のダミーキー。
          PURCHASE_ANDROID_API_KEY=goog_dummy0000000000000000000000
          # 開発モードの PIN。
          DEVELOPER_PASSWORD=0000
          EOF

          # バージョン表示にビルド由来の情報（Actions の Run 番号と日付）を付加する。
          # BuildKonfig の VERSION_NAME はローカルプロパティが無い場合に環境変数を使う。
          base_version=$(grep -m1 '^versionName' gradle/libs.versions.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION_NAME=${base_version}+actions${GITHUB_RUN_NUMBER}-$(date +%Y%m%d)" >> "$GITHUB_ENV"

      # プラットフォーム 37.0 の自動インストールに必要な現行ライセンスのハッシュを補う。
      # ランナーイメージのライセンスファイルが最新版に追いついていない場合の備え。
      - name: Accept SDK licenses
        run: |
          licenseFile="$ANDROID_HOME/licenses/android-sdk-license"
          hash="24333f8a63b6825ea9c5514f83c2829b004d1fee"
          grep -qxF "$hash" "$licenseFile" || echo "$hash" >> "$licenseFile"

      # README-JA の Contribute に従い debug ビルドで配布する。
      # debug ビルドはリポジトリの debug.keystore で署名され、未設定の AdMob ID には
      # テスト ID が使われるため、リリースビルドのような ID 検査や追加設定が不要。
      # RevenueCat のキーは debug でも空だと BillingClient 初期化時にクラッシュするためダミーを注入する。
      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FANBOX-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS / iPadOS (IPA)
    runs-on: macos-latest
    # アーカイブには Kotlin フレームワークのビルドと Firebase / AdMob の
    # SwiftPM 依存の解決・コンパイルが含まれ、30 分では収まらない。
    timeout-minutes: 90
    needs: fankt-maven

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore fankt mavenLocal artifacts
        uses: actions/download-artifact@v4
        with:
          name: fankt-maven-local
          path: ~/.m2/repository/me/matsumo

      # SwiftPM の依存パッケージをキャッシュして、毎回の再取得とネットワーク頼みの
      # 解決を減らす。
      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      # xcodebuild archive 内での依存解決は、ネットワーク不調で無出力のまま
      # ハングして job タイムアウトになることがある。先に単独で解決し、
      # 1 回 10 分で打ち切って 3 回まで再試行する。
      # macOS ランナーには GNU timeout が無いため、watchdog プロセスで打ち切る。
      - name: Resolve SwiftPM packages
        run: |
          resolve_once() {
            xcodebuild -resolvePackageDependencies -project iosApp/iosApp.xcodeproj -scheme iosApp &
            pid=$!
            ( sleep 600 && kill -9 "$pid" 2>/dev/null ) &
            watchdog=$!
            wait "$pid"
            status=$?
            kill "$watchdog" 2>/dev/null
            wait "$watchdog" 2>/dev/null

            return "$status"
          }

          ok=false
          for attempt in 1 2 3; do
            if resolve_once; then
              ok=true
              break
            fi
            echo "resolve attempt $attempt failed"
            sleep 30
          done
          if [ "$ok" != "true" ]; then
            echo "::error::SwiftPM package resolution failed after 3 attempts"
            exit 1
          fi

      # RevenueCat のキーが空のまま BillingClient が構築されると起動時にクラッシュするため、
      # ダミー値を入れておく。IPA は署名なしで直接インストールはできないが、
      # 自前の署名を経て動かす場合にも起動できるようにしておく。
      - name: Create local.properties
        run: |
          cat > local.properties <<'EOF'
          PURCHASE_IOS_API_KEY=appl_dummy0000000000000000000000
          # 開発モードの PIN。
          DEVELOPER_PASSWORD=0000
          EOF

          # バージョン表示にビルド由来の情報（Actions の Run 番号と日付）を付加する。
          # BuildKonfig の VERSION_NAME はローカルプロパティが無い場合に環境変数を使う。
          base_version=$(grep -m1 '^versionName' gradle/libs.versions.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION_NAME=${base_version}+actions${GITHUB_RUN_NUMBER}-$(date +%Y%m%d)" >> "$GITHUB_ENV"

      # secret.plist は実キーを含むため gitignore されているが、Xcode プロジェクトが
      # Resources に含めているため無いと CopyPlistFile でアーカイブが失敗する。
      # 広告の読み込みに使う AdMob ID は公式テスト ID を入れておく。
      - name: Create dummy secret.plist
        run: |
          cat > iosApp/iosApp/secret.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>ADMOB_IOS_BANNER_AD_UNIT_ID</key>
            <string>ca-app-pub-3940256099942544/2934735716</string>
            <key>ADMOB_IOS_NATIVE_AD_UNIT_ID</key>
            <string>ca-app-pub-3940256099942544/9888035569</string>
          </dict>
          </plist>
          EOF

      # 署名しないため、証明書や provisioning profile は不要。archive のみ行う。
      # スキームはプロジェクト唯一のターゲット iosApp（共有スキームが無いため自動生成名）。
      - name: Archive Project
        run: |
          xcodebuild archive -project iosApp/iosApp.xcodeproj \
                             -scheme iosApp \
                             -sdk iphoneos \
                             -configuration Release \
                             -archivePath iosApp.xcarchive \
                             CODE_SIGNING_ALLOWED=NO

      # 署名なし IPA は、archive の .app を Payload ディレクトリに入れて zip 化するだけで作れる。
      # App Store へは提出できず、自前の署名を経てからインストールする。
      - name: Create unsigned IPA
        run: |
          mkdir Payload
          cp -R iosApp.xcarchive/Products/Applications/*.app Payload/
          zip -r MainApp-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FANBOX-release-unsigned-ipa
          path: MainApp-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  # PC 向け Compose Desktop ビルド（非公式）。
  # Windows / macOS / Linux の 3 プラットフォームをマトリクスでビルドし、
  # それぞれの OS に対応するインストーラー形式（msi/exe、dmg、deb/AppImage）を出す。
  # fankt fork は mavenLocal artifact から参照するため、認証情報は不要。
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: fankt-maven

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifact: PixiView-desktop-windows
            patterns: |
              desktopApp/build/compose/binaries/main/exe/*.exe
              desktopApp/build/compose/binaries/main/msi/*.msi
          - os: macos-latest
            name: macOS
            artifact: PixiView-desktop-macos
            patterns: |
              desktopApp/build/compose/binaries/main/dmg/*.dmg
          - os: ubuntu-latest
            name: Linux
            artifact: PixiView-desktop-linux
            patterns: |
              desktopApp/build/compose/binaries/main/deb/*.deb
              desktopApp/build/compose/binaries/main/appimage/*.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # download-artifact は path 直下にファイルを展開するため、~/.m2 の構造を再現する。
      - name: Restore fankt mavenLocal artifacts
        uses: actions/download-artifact@v4
        with:
          name: fankt-maven-local
          path: ~/.m2/repository/me/matsumo

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        shell: bash
        run: |
          cat > local.properties <<'EOF'
          # RevenueCat の起動クラッシュ対策のダミーキー。
          PURCHASE_ANDROID_API_KEY=goog_dummy0000000000000000000000
          # 開発モードの PIN。
          DEVELOPER_PASSWORD=0000
          EOF

          base_version=$(grep -m1 '^versionName' gradle/libs.versions.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION_NAME=${base_version}+actions${GITHUB_RUN_NUMBER}-$(date +%Y%m%d)" >> "$GITHUB_ENV"

      # packageDistributionForCurrentOS が実行環境の OS に対応するインストーラーをビルドする。
      - name: Build desktop distribution
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS

      - name: Upload desktop distribution
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.patterns }}
          if-no-files-found: error
          retention-days: 14
